<svg viewBox="0 0 512 512" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="starRadial" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      
      <animate attributeName="cx" values="50%; 52%; 49%; 50%" dur="10s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1" />
      <animate attributeName="cy" values="50%; 48%; 51%; 50%" dur="10s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1" />
      <animate attributeName="r" values="50%; 55%; 48%; 50%" dur="10s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1" />

      <stop offset="0%">
        <animate attributeName="stop-color" values="#ffff00; #ffcc00; #ff9900; #ffcc00; #ffff00" dur="8s" repeatCount="indefinite" calcMode="linear" />
      </stop>
      
      <stop offset="35%">
        <animate attributeName="stop-color" values="#ff9900; #ffcc00; #ff6600; #ffcc00; #ff9900" dur="8s" repeatCount="indefinite" calcMode="linear" />
      </stop>

      <stop offset="70%">
        <animate attributeName="stop-color" values="#ff6600; #ff9900; #ff3300; #ff9900; #ff6600" dur="8s" repeatCount="indefinite" calcMode="linear" />
      </stop>
      
      <stop offset="100%">
        <animate attributeName="stop-color" values="#ff3300; #990000; rgba(255, 51, 0, 0.3); #990000; #ff3300" dur="8s" repeatCount="indefinite" calcMode="linear" />
      </stop>
    </radialGradient>
  </defs>

  <g transform="translate(256, 256)">
    <path d="M 0 -200
             C 0 -50, 50 0, 200 0 
             C 50 0, 0 50, 0 200 
             C 0 50, -50 0, -200 0 
             C -50 0, 0 -50, 0 -200 Z"
          fill="url(#starRadial)">
      
      <animateTransform 
        attributeName="transform" 
        type="scale" 
        values="0.95; 1.05; 0.95" 
        dur="6s" 
        repeatCount="indefinite" 
        calcMode="spline" 
        keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" />
    </path>
  </g>
</svg>
